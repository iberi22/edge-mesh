name: Feature Request
description: Propose a new feature, adapter, or enhancement for Edge Mesh.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a proposal! Edge Mesh prioritizes local-first architecture, post-quantum security preservation, and zero SaaS lock-in.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
      placeholder: Detailed description of proposed API, behavior, or architecture...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or protocol design notes here.
