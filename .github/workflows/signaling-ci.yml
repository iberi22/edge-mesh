name: CI/CD signaling

on: [push, pull_request]

permissions:
  contents: read

jobs:
  signaling-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workers/signaling/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: workers/signaling
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: workers/signaling
        run: pnpm test
