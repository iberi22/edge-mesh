# Publica @iberi22/edge-mesh en npmjs con provenance. Requiere el secreto NPM_TOKEN del repo. Solo corre con un tag web-v* o a mano.
name: Publish to npm

on:
  workflow_dispatch: {}
  push:
    tags: ['web-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/web
      - run: npm run pack:smoke
      - run: npx -y publint
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
